<!DOCTYPE html>
<html>
<head>
<title>Restaurant App</title>

<style>
body {
  font-family: Arial;
  background: #f5f5f5;
  text-align: center;
}

.container {
  width: 320px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 0 10px rgba(0,0,0,0.2);
}

button {
  margin: 5px;
  padding: 10px;
  border: none;
  border-radius: 10px;
  background: #ff6b6b;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #ff4c4c;
}

input {
  padding: 8px;
  border-radius: 8px;
  border: 1px solid #ccc;
  width: 90%;
}

h1 {
  color: #ff6b6b;
}
</style>

</head>

<body>

<div class="container">

<h1>🍔 Halima Restaurant</h1>

<h3>Login</h3>
<input id="name" placeholder="Enter your name">
<br><br>
<button onclick="login()">Login</button>

<h3 id="welcome"></h3>

<hr>

<h3>Menu</h3>

<button onclick="addItem('Burger', 20)">🍔 Burger (20)</button>
<button onclick="addItem('Pizza', 30)">🍕 Pizza (30)</button>
<button onclick="addItem('Drink', 10)">🥤 Drink (10)</button>

<h3>Your Order:</h3>
<p id="order"></p>

<h3>Total: <span id="total">0</span> SAR</h3>

<hr>

<h3>Order Type</h3>

<button onclick="setType('Delivery')">🚚 Delivery</button>
<button onclick="setType('Pickup')">🏃 Pickup</button>

<h3 id="type"></h3>

<!-- عنوان التوصيل -->
<div id="addressBox" style="display:none;">
  <input id="address" placeholder="Enter delivery address">
</div>

<hr>

<button onclick="pay()">💳 Pay</button>

<h3 id="result"></h3>

</div>

<script>
let total = 0;
let order = "";
let orderType = "";

function login() {
  let name = document.getElementById("name").value;
  document.getElementById("welcome").innerText = "Welcome " + name + " 👋";
}

function addItem(item, price) {
  order += item + " ";
  total += price;
  document.getElementById("order").innerText = order;
  document.getElementById("total").innerText = total;
}

function setType(type) {
  orderType = type;
  document.getElementById("type").innerText = "Order Type: " + type;

  // إذا توصيل يظهر العنوان
  if (type === "Delivery") {
    document.getElementById("addressBox").style.display = "block";
  } else {
    document.getElementById("addressBox").style.display = "none";
  }
}

function pay() {
  if (orderType === "") {
    document.getElementById("result").innerText = "⚠️ Please choose order type";
    return;
  }

  if (orderType === "Delivery") {
    let address = document.getElementById("address").value;
    if (address === "") {
      document.getElementById("result").innerText = "⚠️ Enter address";
      return;
    }
  }

  document.getElementById("result").innerText =
    "✅ Payment Confirmed! (" + orderType + ") Order Closed";
}
</script>

</body>
</html>
