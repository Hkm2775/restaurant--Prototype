<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UNIQU Restaurant</title>

<style>
body {
    font-family: Arial;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
}

.container {
    background: white;
    padding: 20px;
    margin-top: 40px;
    border-radius: 15px;
    width: 300px;
    text-align: center;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

h1 {
    color: #e74c3c;
}

button {
    margin: 5px;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: #ff6b6b;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #e74c3c;
}

input {
    padding: 10px;
    width: 90%;
    margin-bottom: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}
</style>
</head>

<body>

<div class="container">

<h1>🍽️ UNIQU Restaurant</h1>
<p style="color:gray;">Smart Ordering System</p>

<h3>Login</h3>
<input type="text" id="name" placeholder="Enter your name">
<button onclick="login()">Login</button>

<hr>

<h3>Menu</h3>
<button onclick="addItem(20)">🍔 Burger (20)</button>
<button onclick="addItem(30)">🍕 Pizza (30)</button>
<button onclick="addItem(10)">🥤 Drink (10)</button>

<h3>Your Order</h3>
<p id="total">Total: 0 SAR</p>

<button onclick="pay()">💳 Pay</button>

<p id="result"></p>

</div>

<script>

let total = 0;
let userName = "";

function login() {
    userName = document.getElementById("name").value;
    if(userName === "") {
        alert("Enter your name first!");
    } else {
        alert("Welcome " + userName);
    }
}

function addItem(price) {
    total += price;
    document.getElementById("total").innerText = "Total: " + total + " SAR";
}

function pay() {
    if(total === 0) {
        document.getElementById("result").innerText = "Please add items first!";
        return;
    }

    document.getElementById("result").innerText =
    "✅ Payment Confirmed! Thank you " + userName;

    total = 0;
    document.getElementById("total").innerText = "Total: 0 SAR";
}

</script>

</body>
</html>
