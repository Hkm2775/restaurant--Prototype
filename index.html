<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>UNIQUE Restaurant</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b1320;
    color:white;
    text-align:center;
}

.container{
    max-width:400px;
    margin:auto;
    padding:20px;
}

h1{
    color:#f4c27a;
}

.card{
    background:#111c2e;
    padding:15px;
    border-radius:15px;
    margin:10px;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:10px;
    background:linear-gradient(45deg,#ff6ec4,#7873f5);
    color:white;
    cursor:pointer;
}

.menu{
    display:flex;
    justify-content:space-around;
}

.hidden{
    display:none;
}
</style>

</head>

<body>

<div class="container">

    <!-- LOGIN -->
    <div id="loginPage">
        <h1>UNIQUE</h1>
        <p>تسجيل الدخول</p>

        <input id="name" placeholder="اسمك"><br><br>
        <input type="password" placeholder="الرمز"><br><br>

        <button onclick="login()">دخول</button>
    </div>

    <!-- MENU -->
    <div id="menuPage" class="hidden">

        <h2>القائمة</h2>

        <div class="menu">
            <div class="card">
                <p>🍔 برجر</p>
                <p>36 ر.س</p>
                <button onclick="addItem('burger',36)">+</button>
            </div>

            <div class="card">
                <p>🍝 باستا</p>
                <p>34 ر.س</p>
                <button onclick="addItem('pasta',34)">+</button>
            </div>

            <div class="card">
                <p>🥤 بيبسي</p>
                <p>6 ر.س</p>
                <button onclick="addItem('drink',6)">+</button>
            </div>
        </div>

        <h3>طلبك</h3>
        <p id="total">المجموع: 0 ر.س</p>

        <button onclick="goToPayment()">الدفع</button>
    </div>

    <!-- PAYMENT -->
    <div id="paymentPage" class="hidden">

        <h2>الدفع</h2>

        <p id="finalTotal"></p>

        <p>طريقة الدفع:</p>

        <button onclick="confirmOrder()">تأكيد الطلب</button>

    </div>

</div>

<script>

let total = 0;

function login(){
    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("menuPage").classList.remove("hidden");
}

function addItem(name,price){
    total += price;
    document.getElementById("total").innerText = "المجموع: " + total + " ر.س";
}

function goToPayment(){
    document.getElementById("menuPage").classList.add("hidden");
    document.getElementById("paymentPage").classList.remove("hidden");

    document.getElementById("finalTotal").innerText = "الإجمالي: " + total + " ر.س";
}

function confirmOrder(){
    alert("تم تأكيد الطلب ✅");
}

</script>

</body>
</html>
